<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keresés - JátékWeb</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b0f;
            --accent: #00d2ff;
            --text: #ffffff;
            --input-bg: #1a1a24;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 40px;
        }

        .back-link { color: var(--accent); text-decoration: none; display: inline-block; margin-bottom: 20px; }

        .search-wrapper {
            max-width: 700px;
            margin: 0 auto 50px auto;
            text-align: center;
        }

        .search-container {
            position: relative;
            margin-top: 20px;
        }

        .search-input {
            width: 100%;
            padding: 18px 25px;
            background: var(--input-bg);
            border: 2px solid transparent;
            border-radius: 50px;
            color: white;
            font-size: 18px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        /* Suggestions */
        .suggestions {
            position: absolute;
            top: 70px;
            left: 0;
            width: 100%;
            background: #1a1a24;
            border-radius: 15px;
            overflow: hidden;
            z-index: 100;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .suggestion-item {
            padding: 15px 25px;
            text-align: left;
            cursor: pointer;
            border-bottom: 1px solid #222;
            transition: 0.2s;
        }

        .suggestion-item:hover { background: var(--accent); color: black; }

        /* Results */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
        }

        .game-card {
            background: #16161e;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .game-card img { width: 100%; height: 280px; object-fit: cover; }
        .game-info { padding: 15px; text-align: center; font-weight: 500; }
    </style>
</head>
<body>

    <a href="dashboard.html" class="back-link">← Vissza a könyvtárba</a>

    <div class="search-wrapper">
        <h1>Mit játszanál ma?</h1>
        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="Keress név vagy típus alapján..." autocomplete="off">
            <div id="suggestions" class="suggestions"></div>
        </div>
    </div>

    <div id="results" class="results-grid"></div>

    <script type="module">
        import { games } from './list.games.js';

        const input = document.getElementById('search-input');
        const suggestBox = document.getElementById('suggestions');
        const results = document.getElementById('results');

        input.oninput = () => {
            const val = input.value.toLowerCase();
            suggestBox.innerHTML = '';
            
            if (val.length < 1) return;

            const filtered = games.filter(g => g.name.toLowerCase().includes(val));
            
            filtered.slice(0, 5).forEach(game => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerText = game.name;
                div.onclick = () => {
                    input.value = game.name;
                    suggestBox.innerHTML = '';
                    showResults(game.name);
                };
                suggestBox.appendChild(div);
            });
        };

        function showResults(query) {
            results.innerHTML = '';
            const filtered = games.filter(g => g.name.toLowerCase().includes(query.toLowerCase()));
            
            filtered.forEach(game => {
                results.innerHTML += `
                    <div class="game-card">
                        <img src="cover.image/${game.icon}" alt="${game.name}" onerror="this.src='https://via.placeholder.com/200x280'">
                        <div class="game-info">${game.name}</div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
