<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Progress - JátékWeb</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0b0f; --accent: #00d2ff; --card: #16161e; --text: #fff; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); display: flex; margin: 0; }
        aside { width: 240px; background: #101016; padding: 30px; height: 100vh; border-right: 1px solid #222; }
        aside a { color: #aaa; text-decoration: none; display: block; padding: 10px; margin: 5px 0; border-radius: 8px; }
        aside a.active { background: rgba(0,210,255,0.1); color: var(--accent); }
        
        main { flex: 1; padding: 40px; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .stat-card { background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid #222; }
        .quest-item { background: #1f1f2b; padding: 15px; margin: 10px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .quest-done { border-left: 4px solid #4caf50; opacity: 0.7; }
        .btn-quest { background: var(--accent); border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <aside>
        <h2>JátékWeb</h2>
        <a href="dashboard.html">Főoldal</a>
        <a href="search.html">Keresés</a>
        <a href="progress.html" class="active">Haladás</a>
        <a href="profil.html">Profil</a>
    </aside>

    <main>
        <h1>A te fejlődésed</h1>
        <div class="grid">
            <div class="stat-card">
                <h3>Játékidő (óra/nap)</h3>
                <canvas id="playtimeChart"></canvas>
            </div>
            <div class="stat-card">
                <h3>Aktív küldetések</h3>
                <div id="quest-list">
                    <div class="quest-item"><span>Regisztrálj az oldalon</span> <button class="btn-quest" onclick="completeQuest(1)">Kész</button></div>
                    <div class="quest-item"><span>Tölts fel egy avatart</span> <button class="btn-quest" onclick="completeQuest(2)">Kész</button></div>
                    <div class="quest-item"><span>Keress rá 5 játékra</span> <button class="btn-quest" onclick="completeQuest(3)">Kész</button></div>
                    <div class="quest-item"><span>Játssz 10 órát</span> <button class="btn-quest" onclick="completeQuest(4)">Kész</button></div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth, db, onAuthStateChanged, doc, setDoc, getDoc } from './firebase-config.js';

        // Grafikon inicializálása
        const ctx = document.getElementById('playtimeChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Hétfő', 'Kedd', 'Szerda', 'Csütörtök', 'Péntek', 'Szombat', 'Vasárnap'],
                datasets: [{
                    label: 'Játékidő (óra)',
                    data: [2, 5, 3, 8, 4, 10, 12],
                    borderColor: '#00d2ff',
                    backgroundColor: 'rgba(0, 210, 255, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { plugins: { legend: { labels: { color: 'white' } } }, scales: { y: { ticks: { color: 'white' } }, x: { ticks: { color: 'white' } } } }
        });

        window.completeQuest = async (id) => {
            const user = auth.currentUser;
            if (!user) return;
            // Küldetés mentése Firestore-ba
            await setDoc(doc(db, "quests", user.uid), {
                [`quest_${id}`]: true
            }, { merge: true });
            alert("Küldetés teljesítve!");
        };
    </script>
</body>
</html>
