<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - JátékWeb</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; padding: 20px; }
        nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .section { margin-top: 30px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; margin-top: 10px; }
        .game-card { background: #1e1e1e; padding: 10px; border-radius: 8px; text-align: center; }
        .game-card img { width: 100%; border-radius: 4px; height: 200px; object-fit: cover; }
        a { color: #4da6ff; text-decoration: none; }
    </style>
</head>
<body>
    <nav>
        <h1>JátékWeb Könyvtár</h1>
        <div>
            <a href="search.html">Keresés</a> | 
            <button id="btn-logout" style="background:none; border:none; color:red; cursor:pointer;">Kijelentkezés</button>
        </div>
    </nav>

    <div class="section">
        <h2>Neked ajánlott</h2>
        <div id="recommended" class="game-grid"></div>
    </div>

    <div class="section">
        <h2>A felkapottak</h2>
        <div id="trending" class="game-grid"></div>
    </div>

    <div class="section">
        <h2>Új játékok</h2>
        <div id="new-games" class="game-grid"></div>
    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { games } from './list.games.js';

        // Autentikáció ellenőrzése
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html'; // Visszadob a loginra
            } else {
                displayGames();
            }
        });

        function displayGames() {
            const containers = ['recommended', 'trending', 'new-games'];
            containers.forEach(id => {
                const container = document.getElementById(id);
                // Példaként mindenhova betesszük a listát
                games.forEach(game => {
                    container.innerHTML += `
                        <div class="game-card">
                            <img src="cover.image/${game.icon}" alt="${game.name}" onerror="this.src='https://via.placeholder.com/150x200?text=No+Image'">
                            <p>${game.name}</p>
                        </div>
                    `;
                });
            });
        }

        document.getElementById('btn-logout').onclick = () => signOut(auth);
    </script>
</body>
</html>
