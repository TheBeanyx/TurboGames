<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvtár - JátékWeb</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b0f;
            --card-bg: #16161e;
            --accent: #00d2ff;
            --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        aside {
            width: 240px;
            background: #101016;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #222;
        }

        aside h1 { font-size: 22px; color: var(--accent); margin-bottom: 40px; }
        
        aside a {
            color: #aaa;
            text-decoration: none;
            padding: 12px;
            margin: 5px 0;
            border-radius: 8px;
            transition: 0.3s;
        }

        aside a:hover, aside a.active {
            background: var(--glass);
            color: var(--accent);
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 600;
            border-left: 4px solid var(--accent);
            padding-left: 15px;
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.2);
            border-color: var(--accent);
        }

        .game-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .game-info {
            padding: 15px;
            text-align: center;
        }

        .game-info p { margin: 0; font-size: 14px; font-weight: 500; }

        .btn-logout {
            background: rgba(255, 71, 71, 0.1);
            color: #ff4747;
            border: 1px solid #ff4747;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-logout:hover { background: #ff4747; color: white; }
    </style>
</head>
<body>

    <aside>
        <h1>JátékWeb</h1>
        <a href="dashboard.html" class="active">Főoldal</a>
        <a href="search.html">Felfedezés</a>
        <a href="#">Könyvtáram</a>
        <div style="margin-top: auto;">
            <button id="btn-logout" class="btn-logout">Kijelentkezés</button>
        </div>
    </aside>

    <main>
        <header>
            <h2 id="welcome-msg">Üdvözlünk!</h2>
        </header>

        <div class="section-title">Neked ajánlott</div>
        <div id="recommended" class="game-grid"></div>

        <div class="section-title">A felkapottak</div>
        <div id="trending" class="game-grid"></div>

        <div class="section-title">Új játékok</div>
        <div id="new-games" class="game-grid"></div>
    </main>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { games } from './list.games.js';

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                document.getElementById('welcome-msg').innerText = `Szia, ${user.displayName || 'Játékos'}!`;
                renderGames();
            }
        });

        function renderGames() {
            const sections = ['recommended', 'trending', 'new-games'];
            sections.forEach(id => {
                const container = document.getElementById(id);
                games.forEach(game => {
                    container.innerHTML += `
                        <div class="game-card">
                            <img src="cover.image/${game.icon}" alt="${game.name}" onerror="this.src='https://via.placeholder.com/200x250?text=Kép+hiányzik'">
                            <div class="game-info">
                                <p>${game.name}</p>
                            </div>
                        </div>
                    `;
                });
            });
        }

        document.getElementById('btn-logout').onclick = () => signOut(auth);
    </script>
</body>
</html>
