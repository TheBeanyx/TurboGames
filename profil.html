<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Beállítások - JátékWeb</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b0f;
            --accent: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.3);
            --card: #16161e;
            --text: #ffffff;
            --input-bg: #252533;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar stílus a konzisztencia miatt */
        aside {
            width: 240px;
            background: #101016;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #222;
        }

        aside h1 { font-size: 22px; color: var(--accent); margin-bottom: 40px; }
        aside a {
            color: #aaa;
            text-decoration: none;
            padding: 12px;
            margin: 5px 0;
            border-radius: 8px;
            transition: 0.3s;
        }
        aside a:hover, aside a.active { background: rgba(255,255,255,0.05); color: var(--accent); }

        /* Profil tartalom */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .profile-container {
            background: var(--card);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        h2 { margin-bottom: 30px; font-weight: 600; }

        .avatar-section {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
        }

        .avatar-section img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .file-upload-label {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: var(--accent);
            color: black;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }

        input[type="file"] { display: none; }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background: var(--input-bg);
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-save {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, var(--accent), #3a7bd5);
            border: none;
            border-radius: 10px;
            color: black;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-save:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px var(--accent-glow);
        }

        #status-msg {
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <aside>
        <h1>JátékWeb</h1>
        <a href="dashboard.html">Főoldal</a>
        <a href="search.html">Felfedezés</a>
        <a href="progress.html">Haladás</a>
        <a href="friends.html">Barátok</a>
        <a href="profil.html" class="active">Profil</a>
    </aside>

    <main>
        <div class="profile-container">
            <h2>Profil Szerkesztése</h2>
            
            <div class="avatar-section">
                <img id="avatar-preview" src="https://via.placeholder.com/150" alt="Avatar">
                <label for="avatar-input" class="file-upload-label">+</label>
                <input type="file" id="avatar-input" accept="image/*">
            </div>

            <div class="input-group">
                <label>Becenév / Megjelenített név</label>
                <input type="text" id="display-name" placeholder="Írd be a beceneved...">
            </div>

            <button id="save-profile" class="btn-save">Módosítások mentése</button>
            <p id="status-msg"></p>
        </div>
    </main>

    <script type="module">
        import { auth, db, storage, onAuthStateChanged, doc, setDoc, getDoc, ref, uploadBytes, getDownloadURL } from './firebase-config.js';

        const avatarInput = document.getElementById('avatar-input');
        const avatarPreview = document.getElementById('avatar-preview');
        const nicknameInput = document.getElementById('display-name');
        const statusMsg = document.getElementById('status-msg');

        // 1. Felhasználói adatok betöltése
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    nicknameInput.value = data.nickname || "";
                    if (data.avatarUrl) {
                        avatarPreview.src = data.avatarUrl;
                    }
                }
            } catch (err) {
                console.error("Hiba az adatok lekérésekor:", err);
            }
        });

        // 2. Kép előnézet azonnal (még feltöltés előtt)
        avatarInput.onchange = () => {
            const [file] = avatarInput.files;
            if (file) {
                avatarPreview.src = URL.createObjectURL(file);
            }
        };

        // 3. Mentés folyamata
        document.getElementById('save-profile').onclick = async () => {
            const user = auth.currentUser;
            if (!user) return;

            statusMsg.style.color = var(--accent);
            statusMsg.innerText = "Mentés folyamatban...";
            
            const nickname = nicknameInput.value;
            const file = avatarInput.files[0];
            let finalAvatarUrl = avatarPreview.src;

            try {
                // Ha van új fájl, feltöltjük Storage-ba
                if (file) {
                    const storageRef = ref(storage, `avatars/${user.uid}`);
                    await uploadBytes(storageRef, file);
                    finalAvatarUrl = await getDownloadURL(storageRef);
                }

                // Firestore dokumentum frissítése (vagy létrehozása)
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    nickname: nickname,
                    avatarUrl: finalAvatarUrl,
                    updatedAt: new Date()
                }, { merge: true });

                statusMsg.style.color = "#4caf50";
                statusMsg.innerText = "Sikeresen mentve!";
                
                setTimeout(() => { statusMsg.innerText = ""; }, 3000);

            } catch (error) {
                console.error(error);
                statusMsg.style.color = "#ff4747";
                statusMsg.innerText = "Hiba történt a mentés során.";
            }
        };
    </script>
</body>
</html>
