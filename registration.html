<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Regisztráció - JátékWeb</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #121212; color: white; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; width: 300px; }
        input { width: 100%; margin: 10px 0; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; cursor: pointer; margin-top: 10px; }
        .google-btn { background: #db4437; color: white; border: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Regisztráció</h2>
        <input type="email" id="reg-email" placeholder="E-mail cím">
        <input type="password" id="reg-password" placeholder="Jelszó">
        <button id="btn-register">Regisztráció e-maillel</button>
        <hr>
        <button id="btn-google" class="google-btn">Regisztráció Google-lel</button>
        <p>Van már fiókod? <a href="index.html" style="color: #4da6ff;">Jelentkezz be!</a></p>
    </div>

    <script type="module">
        import { auth, googleProvider, createUserWithEmailAndPassword, signInWithPopup } from './firebase-config.js';

        // E-mail regisztráció
        document.getElementById('btn-register').onclick = async () => {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert("Sikeres regisztráció!");
                window.location.href = 'index.html';
            } catch (error) {
                alert("Hiba: " + error.message);
            }
        };

        // Google regisztráció
        document.getElementById('btn-google').onclick = async () => {
            try {
                await signInWithPopup(auth, googleProvider);
                window.location.href = 'index.html';
            } catch (error) {
                alert("Hiba: " + error.message);
            }
        };
    </script>
</body>
</html>
