<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regisztráció - JátékWeb</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #00d2ff;
            --secondary-purple: #3a7bd5;
            --bg-dark: #0f0f13;
            --card-bg: #1a1a24;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f13 100%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .auth-container {
            background: rgba(26, 26, 36, 0.8);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h2 { font-weight: 600; margin-bottom: 10px; letter-spacing: 1px; }
        p.subtitle { color: #888; font-size: 14px; margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        
        input {
            width: 100%;
            padding: 12px 15px;
            background: #252533;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }

        .btn-main {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, var(--primary-blue), var(--secondary-purple));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-main:hover { transform: translateY(-2px); opacity: 0.9; }

        .divider {
            margin: 25px 0;
            display: flex;
            align-items: center;
            color: #666;
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #333;
            margin: 0 10px;
        }

        .btn-google {
            width: 100%;
            padding: 10px;
            background: white;
            color: #333;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-google img { width: 20px; }

        .btn-google:hover { background: #f1f1f1; }

        .footer-link { margin-top: 25px; font-size: 13px; color: #aaa; }
        .footer-link a { color: var(--primary-blue); text-decoration: none; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2>Fiók létrehozása</h2>
    <p class="subtitle">Csatlakozz a játékosok közösségéhez!</p>

    <div class="input-group">
        <input type="email" id="reg-email" placeholder="E-mail cím">
    </div>
    <div class="input-group">
        <input type="password" id="reg-password" placeholder="Jelszó">
    </div>
    <button id="btn-register" class="btn-main">Regisztráció</button>

    <div class="divider">VAGY</div>

    <button id="btn-google" class="btn-google">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_Logo.svg" alt="Google">
        Regisztráció Google-lel
    </button>

    <div class="footer-link">
        Már van fiókod? <a href="index.html">Bejelentkezés</a>
    </div>
</div>

<script type="module">
    import { auth, googleProvider, createUserWithEmailAndPassword, signInWithPopup } from './firebase-config.js';

    // E-mail regisztráció
    document.getElementById('btn-register').onclick = async () => {
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        
        if (password.length < 6) {
            alert("A jelszónak legalább 6 karakternek kell lennie!");
            return;
        }

        try {
            await createUserWithEmailAndPassword(auth, email, password);
            alert("Sikeres regisztráció! Most már bejelentkezhetsz.");
            window.location.href = 'index.html';
        } catch (error) {
            alert("Hiba: " + error.message);
        }
    };

    // Google regisztráció
    document.getElementById('btn-google').onclick = async () => {
        try {
            await signInWithPopup(auth, googleProvider);
            // Mivel a Google auth azonnal be is léptet, mehetünk a dashboardra
            window.location.href = 'dashboard.html';
        } catch (error) {
            alert("Hiba: " + error.message);
        }
    };
</script>

</body>
</html>
